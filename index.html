<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SIGATT - Registro de Usuarios</title>

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- ===== Google reCAPTCHA ===== -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LcKwKstAAAAAGzwQheRwzFw8upHcFpkYWosjBbD"></script>

    <!-- ===== Favicon ===== -->
    <link rel="icon" type="image/png" href="images/LOGO-SIGATT.png">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo-link">
                <img src="images/LOGO-SIGATT.png" alt="SIGATT - Sistema Integral de Gestión Administrativa de Tránsito y Transporte" class="logo-image">
                <div class="logo-text">
                    <span class="logo-title">SIGATT</span>
                    <span class="logo-subtitle">Sistema Integral de Gestión Administrativa de Tránsito y Transporte</span>
                </div>
            </a>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
        <div class="form-wrapper">
            <div class="form-card">
                <!-- Línea corporativa -->
                <div class="corporate-line-sm"></div>

                <h2 style="margin-bottom: var(--spacing-xs);">Registro de Usuario</h2>
                <p class="text-secondary text-small" style="margin-bottom: var(--spacing-lg);">Complete sus datos para iniciar el proceso</p>

                <!-- ===== MENSAJE DE ESTADO (Validación de token) ===== -->
                <div id="statusMessage" class="mensaje" style="display: none;"></div>

                <!-- ===== CONTENEDOR DEL FORMULARIO ===== -->
                <div id="formContainer" style="display: block;">
                    <form id="registroForm" class="registro-form" novalidate>
                        <!-- Nombres -->
                        <div class="form-group">
                            <label for="nombres" class="form-label">Nombres y Apellidos</label>
                            <input type="text" id="nombres" name="nombres" class="form-input"
                                   placeholder="Ingrese sus nombres completos"
                                   required minlength="3" maxlength="100" autocomplete="name">
                            <span class="form-error" id="nombresError"></span>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" name="email" class="form-input"
                                   placeholder="ejemplo@correo.com"
                                   required autocomplete="email">
                            <span class="form-error" id="emailError"></span>
                        </div>

                        <!-- Celular -->
                        <div class="form-group">
                            <label for="celular" class="form-label">Número de Contacto</label>
                            <input type="tel" id="celular" name="celular" class="form-input"
                                   placeholder="3001234567"
                                   required autocomplete="tel" inputmode="numeric"
                                   maxlength="15">
                            <span class="form-help">📱 Ingrese solo números (mínimo 10 dígitos)</span>
                            <span class="form-error" id="celularError"></span>
                        </div>

                        <!-- Botón -->
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                                Registrarse
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 12h14M12 5l7 7-7 7"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- ===== MENSAJE DE ÉXITO/ERROR ===== -->
                <div id="mensaje" class="form-error" style="display: none; margin-top: var(--spacing-lg);"></div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
        <div class="container">
            <p class="footer-text">&copy; 2026 SIGATT - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
